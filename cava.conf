[general]
bars = 4
framerate = 30

[input]
method = pulse
source = auto

[smoothing]
monstercat = 1
noise_reduction = 0.77
autosens = 0
sensitivity = 15

[output]
# Mono: one spectrum across all 4 bars, low to high. Stereo (cava's default)
# would mirror the left channel against the right, so bars 1/4 and 2/3 move
# together.
channels = mono
mono_option = average
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
